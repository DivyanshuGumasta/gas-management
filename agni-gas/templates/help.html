{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/support_data.css') }}">

<div class="sd-page-head">
  <h1 class="page-title">{{ title }}</h1>
  <p>Get in touch with the support team by email or phone.</p>
</div>

<div id="help-error" class="banner banner-error" hidden>
  <span>Could not load support contacts.</span>
  <button class="btn btn-ghost btn-sm" id="help-retry" type="button">Retry</button>
</div>

<section id="help-contacts" class="sd-contact-grid" aria-live="polite" aria-busy="true">
  <div class="sd-loading card">Loading support contacts…</div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/help.js') }}"></script>
{% endblock %}
