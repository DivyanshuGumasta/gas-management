{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/customers.css') }}">

<div id="cd-error" class="banner banner-error" hidden>
  <span></span>
  <button class="btn btn-ghost btn-sm" id="cd-retry">Retry</button>
</div>

<div id="cd-missing" class="state" hidden>
  <b>Customer not found</b>They may have been deleted.
  <a class="btn btn-dark" href="/customers">Back to customers</a>
</div>

<div id="cd-main" hidden>
  <div class="page-head">
    <div class="title-block">
      <a class="back-btn" href="/customers" aria-label="Back to customers"><i data-cicon="chevronLeft"></i></a>
      <div><h1 id="cd-name"></h1><small id="cd-type"></small></div>
    </div>
    <div class="head-actions">
      <div class="menu-wrap" id="cd-export" data-scope="">
        <button class="btn btn-white" data-menu-toggle type="button"><i data-cicon="download"></i>Export<i data-cicon="chevronDown"></i></button>
        <div class="menu" hidden>
          <button type="button" data-export="pdf">Download PDF</button>
          <button type="button" data-export="excel">Download Excel</button>
        </div>
      </div>
      <button class="btn btn-white" id="cd-edit" type="button">Edit</button>
      <button class="btn btn-white" id="cd-delete" type="button">Delete</button>
    </div>
  </div>

  <div class="detail-grid">
    <aside>
      <div class="profile-card">
        <div class="profile-top">
          <span class="avatar" id="cd-avatar"></span>
          <div><b id="cd-name2"></b><span class="badge" id="cd-type2"></span></div>
        </div>
        <div class="profile-stats">
          <div><small id="cd-bal-label">Balance</small><b id="cd-bal"></b></div>
          <div><small>Cylinders</small><b id="cd-cyl">0</b></div>
        </div>
        <div class="profile-meta" id="cd-meta"></div>
      </div>
      <div class="side-actions">
        <a class="btn btn-orange" id="cd-newsale" href="/sales/new">New Sale</a>
        <button class="btn btn-green" id="cd-receive" type="button">Receive</button>
        <button class="btn btn-white" id="cd-return" type="button">Return empties</button>
        <button class="btn btn-white" id="cd-statement" type="button" data-export="pdf">Statement</button>
      </div>
    </aside>

    <section>
      <div class="tabs" role="tablist">
        <button class="tab on" data-tab="ledger" type="button">Ledger</button>
        <button class="tab" data-tab="cylinders" type="button">Cylinders <small id="cd-cyl-count"></small></button>
        <button class="tab" data-tab="prices" type="button">Special price</button>
      </div>
      <div class="panel" id="cd-panel"></div>
    </section>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/customers_common.js') }}"></script>
<script src="{{ url_for('static', filename='js/customer_detail.js') }}"></script>
{% endblock %}
